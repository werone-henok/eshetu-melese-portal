name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies for Canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install Node Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Prepare Deployment Staging Directories
        run: |
          # 1. Compute target server directories
          TARGET_DIR="${{ secrets.FTP_SERVER_DIR || 'eshetu-portal/' }}"
          [[ "${TARGET_DIR}" != */ ]] && TARGET_DIR="${TARGET_DIR}/"
          echo "ROOT_SERVER_DIR=${TARGET_DIR}" >> $GITHUB_ENV
          echo "NEXT_SERVER_DIR=${TARGET_DIR}.next/" >> $GITHUB_ENV

          # 2. Stage .next files into a non-dot directory so FTP-Deploy-Action does not skip them
          mkdir -p deploy-staging-next
          rsync -av --exclude 'cache' .next/ deploy-staging-next/

          # 3. Stage root application files
          mkdir -p deploy-staging
          cp -r src deploy-staging/
          cp -r prisma deploy-staging/
          
          # Copy public assets excluding runtime uploads
          mkdir -p deploy-staging/public
          rsync -av --exclude 'uploads' public/ deploy-staging/public/
          
          # Stamp deployment info for verification
          node -e "const fs = require('fs'); fs.writeFileSync('deploy-staging/public/deploy-status.json', JSON.stringify({commit: '${{ github.sha }}', deployedAt: new Date().toISOString(), routes: {marketing: '/marketing', marketingInquiry: '/api/marketing/inquiry', systemRestart: '/api/admin/system/restart'}}, null, 2));"

          # Copy root server and config files
          cp package.json package-lock.json server.js next.config.ts tsconfig.json postcss.config.js tailwind.config.js reset-admin.js deploy-staging/
          
          # Create restart.txt to trigger automatic Phusion Passenger restart on cPanel
          mkdir -p deploy-staging/tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ" > deploy-staging/tmp/restart.txt

      - name: Deploy .next Compiled Output via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'ftp.comedianeshetu.com' }}
          username: ${{ secrets.FTP_USERNAME || 'comedizx' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ env.NEXT_SERVER_DIR }}
          local-dir: ./deploy-staging-next/
          protocol: ftp
          port: ${{ secrets.FTP_PORT || 21 }}
          timeout: 600000

      - name: Deploy Application Root via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'ftp.comedianeshetu.com' }}
          username: ${{ secrets.FTP_USERNAME || 'comedizx' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ env.ROOT_SERVER_DIR }}
          local-dir: ./deploy-staging/
          protocol: ftp
          port: ${{ secrets.FTP_PORT || 21 }}
          timeout: 600000

      - name: Trigger Node.js Worker Reload
        run: |
          echo "Sending reload signal to live Node.js worker..."
          curl -k -s "https://comedianeshetu.com/api/admin/system/restart?token=${{ secrets.JWT_SECRET || 'eshetu_super_secret_jwt_key_2026_change_in_production_min32chars' }}" || true
          echo "Reload signal dispatched."
