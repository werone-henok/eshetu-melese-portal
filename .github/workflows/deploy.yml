name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies for Canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install Node Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Package Production Build Archive
        run: |
          echo "📦 Creating optimized deploy-package..."
          mkdir -p deploy-package
          
          # Copy .next excluding cache and diagnostics (reduces size significantly)
          mkdir -p deploy-package/.next
          rsync -av --exclude 'cache' --exclude 'diagnostics' .next/ deploy-package/.next/
          
          # Copy source, prisma and public
          cp -r src deploy-package/
          cp -r prisma deploy-package/
          mkdir -p deploy-package/public
          rsync -av --exclude 'uploads' public/ deploy-package/public/
          
          # Stamp deploy status
          node -e "const fs = require('fs'); fs.writeFileSync('deploy-package/public/deploy-status.json', JSON.stringify({commit: '${{ github.sha }}', deployedAt: new Date().toISOString()}, null, 2));"
          
          # Copy configs and server
          cp package.json package-lock.json server.js next.config.ts tsconfig.json postcss.config.js tailwind.config.js reset-admin.js deploy-package/
          
          # Create tmp/restart.txt
          mkdir -p deploy-package/tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ" > deploy-package/tmp/restart.txt
          
          # Create single compressed archive
          cd deploy-package
          zip -rq ../deploy.zip .
          cd ..
          ls -lh deploy.zip

      - name: Instant Upload via FTP in Seconds
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || 'ftp.comedianeshetu.com' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || 'comedizx' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || 'eshetu-portal' }}
        run: |
          python3 -c "
          import ftplib, os, io, datetime

          server = os.environ.get('FTP_SERVER', 'ftp.comedianeshetu.com')
          username = os.environ.get('FTP_USERNAME', 'comedizx')
          password = os.environ.get('FTP_PASSWORD', '')
          target_dir = os.environ.get('FTP_SERVER_DIR', 'eshetu-portal').strip('/')

          print(f'Connecting to {server}...')
          ftp = ftplib.FTP(server, timeout=120)
          ftp.login(username, password)
          print(f'Logged in as {username}. Current dir: {ftp.pwd()}')

          try:
              ftp.cwd(target_dir)
          except Exception as e:
              print(f'Directory {target_dir} error: {e}')
              ftp.cwd('eshetu-portal')

          print(f'Uploading deploy.zip to {ftp.pwd()}...')
          with open('deploy.zip', 'rb') as f:
              ftp.storbinary('STOR deploy.zip', f, blocksize=1024*1024)
          print('✅ deploy.zip uploaded successfully in seconds!')

          # Upload server.js directly so auto-unzip hook is immediately available
          if os.path.exists('server.js'):
              print('Uploading updated server.js...')
              with open('server.js', 'rb') as f:
                  ftp.storbinary('STOR server.js', f)
              print('✅ server.js uploaded!')

          # Upload restart.txt
          try:
              ftp.mkd('tmp')
          except Exception:
              pass
          restart_stamp = datetime.datetime.utcnow().isoformat()
          ftp.storbinary('STOR tmp/restart.txt', io.BytesIO(restart_stamp.encode('utf-8')))
          print('✅ tmp/restart.txt updated!')

          ftp.quit()
          print('🎉 Fast deployment upload complete!')
          "

      - name: Trigger Node.js Worker Reload
        run: |
          echo "Sending reload signal to live Node.js worker..."
          curl -k -s "https://comedianeshetu.com/api/admin/system/restart?token=${{ secrets.JWT_SECRET || 'eshetu_super_secret_jwt_key_2026_change_in_production_min32chars' }}" || true
          echo "Reload signal dispatched."
