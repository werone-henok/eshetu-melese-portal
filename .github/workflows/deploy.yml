name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies for Canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install Node Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Prepare Deployment Staging Directory
        run: |
          mkdir -p deploy-staging
          
          # Copy .next excluding cache (reduces upload by 90%)
          mkdir -p deploy-staging/.next
          rsync -av --exclude 'cache' .next/ deploy-staging/.next/
          
          # Copy source code and Prisma
          cp -r src deploy-staging/
          cp -r prisma deploy-staging/
          
          # Copy public assets excluding runtime uploads
          mkdir -p deploy-staging/public
          rsync -av --exclude 'uploads' public/ deploy-staging/public/
          
          # Copy root server and config files
          cp package.json package-lock.json server.js next.config.ts tsconfig.json postcss.config.js tailwind.config.js reset-admin.js deploy-staging/
          
          # Create restart.txt to trigger automatic Phusion Passenger restart on cPanel
          mkdir -p deploy-staging/tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ" > deploy-staging/tmp/restart.txt

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'ftp.comedianeshetu.com' }}
          username: ${{ secrets.FTP_USERNAME || 'comedizx' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'eshetu-portal/' }}
          local-dir: ./deploy-staging/
          protocol: ftp
          port: ${{ secrets.FTP_PORT || 21 }}
          timeout: 600000
